[project]
name = "aura-companion"
version = "0.3.0"
description = "Local Bluetooth audio sync and transcription for AURA A03"
requires-python = ">=3.12,<3.14"
dependencies = ["bleak==3.0.2", "faster-whisper>=1.2.0,<2"]

[project.scripts]
aura = "aura_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_companion"]
