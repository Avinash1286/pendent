# DK-only external PDM/NAND capture and authorized transfer integration.
CONFIG_STD_C11=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_HWINFO=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=n
CONFIG_AURA_DMIC_NRFX_PDM=y

# sys_csrand_get must propagate hardware entropy errors, never timer/test bytes.
# CSPRNG_ENABLED is derived from ENTROPY_HAS_DRIVER (not a user-prompt option);
# CMake and the post-link report require its resolved value to be y.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y
CONFIG_ENTROPY_NRF5_BIAS_CORRECTION=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_TEST_CSPRNG_GENERATOR=n
CONFIG_TIMER_RANDOM_GENERATOR=n
CONFIG_XOSHIRO_RANDOM_GENERATOR=n
CONFIG_CTR_DRBG_CSPRNG_GENERATOR=n

# One peripheral link. L4 requires authenticated LE Secure Connections pairing;
# root main displays a fresh passkey only during its explicit local window.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AURA A04 DK"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_ID_MAX=1
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_FIXED_PASSKEY=n
CONFIG_BT_USE_DEBUG_KEYS=n
CONFIG_BT_STORE_DEBUG_KEYS=n
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_FILTER_ACCEPT_LIST=y

# One immutable notification in flight; reserve additional protocol/SMP buffers.
# Generic adapter supports 23..517; this initial memory-bounded target caps247.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=3
CONFIG_BT_L2CAP_TX_FRAG_COUNT=2
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_ATT_PREPARE_COUNT=0
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_EATT=n
CONFIG_BT_RECV_WORKQ_BT=y
CONFIG_BT_RX_STACK_SIZE=2048

# Internal NOR stores only BT identities/bonds/CCC; it is not owner-key storage.
# The owner context is explicitly supplied over trusted local UART after boot.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SETTINGS_CCC_STORE_MAX=4
CONFIG_BT_SETTINGS_CCC_LAZY_LOADING=y
CONFIG_BT_SETTINGS_CCC_STORE_ON_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_SETTINGS_NVS_NAME_CACHE=n
CONFIG_NVS_LOOKUP_CACHE=n
CONFIG_NVS_INIT_BAD_MEMORY_REGION=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n

# Main owns explicit reader4096/storage49152 stacks; do not shrink codec stack.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_ASSERT=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_LOG=n
