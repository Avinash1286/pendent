[project]
name = "aura-companion"
version = "0.4.0"
description = "Local AURA audio sync, verified capture import and transcription"
requires-python = ">=3.12,<3.14"
dependencies = ["bleak==3.0.2", "faster-whisper>=1.2.0,<2", "av==18.1.0"]

[project.scripts]
aura = "aura_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_companion"]
